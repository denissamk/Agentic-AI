[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Denis Sam Kusmahendra", email = "denissamkusmahen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=0.3.0",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.2",
    "ipykernel>=7.4.0",
    "streamlit>=1.66.1",
    "notebook>=7.6.3",
    "jupyterthemes>=0.20.0",
    "google-genai>=2.31.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
